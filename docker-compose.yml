services:
  app:
    build: .
    container_name: loansystem_app
    ports:
      - "8080:8080"
    networks:
      - spring-network
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: mysql_database
    environment:
      MYSQL_ROOT_PASSWORD: bddroque
      MYSQL_DATABASE: book_loan_system
    ports:
      - "3307:3306"
    networks:
      - spring-network
    volumes:
      - mysql-data:/var/lib/mysql
networks:
  spring-network:
volumes:
  mysql-data: