spring.application.name=loansystem

spring.datasource.url=jdbc:mysql://localhost:3306/book_loan_system

spring.datasource.username=root
spring.datasource.password=bddroque

# Driver JDBC de MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Dialecto de Hibernate para MySQL (si us\uFFFDs JPA)
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Otras configuraciones \uFFFDtiles
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logging.level.org.springdoc=DEBUG
logging.level.org.springframework.web=DEBUG
